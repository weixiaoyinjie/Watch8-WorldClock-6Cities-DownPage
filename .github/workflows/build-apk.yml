
name: 构建 Watch8 六城市世界时间 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project (root, subfolder or source ZIP)
        shell: bash
        run: |
          set -euo pipefail

          is_android_project() {
            local dir="$1"
            [[ -f "$dir/settings.gradle" || -f "$dir/settings.gradle.kts" ]] &&
            [[ -f "$dir/build.gradle" || -f "$dir/build.gradle.kts" ]] &&
            [[ -f "$dir/app/build.gradle" || -f "$dir/app/build.gradle.kts" ]] &&
            [[ -f "$dir/app/src/main/AndroidManifest.xml" ]]
          }

          PROJECT_DIR=""

          # Case 1: project in repository root
          if is_android_project "$GITHUB_WORKSPACE"; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          fi

          # Case 2: project in a subfolder
          if [[ -z "$PROJECT_DIR" ]]; then
            while IFS= read -r -d '' settings; do
              candidate="$(dirname "$settings")"
              if is_android_project "$candidate"; then
                PROJECT_DIR="$candidate"
                break
              fi
            done < <(find "$GITHUB_WORKSPACE" -maxdepth 6 -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' -print0)
          fi

          # Case 3: source uploaded as ZIP
          if [[ -z "$PROJECT_DIR" ]]; then
            count=0
            while IFS= read -r -d '' source_zip; do
              count=$((count + 1))
              extract_dir="$RUNNER_TEMP/watch8-worldclock-source-$count"
              mkdir -p "$extract_dir"

              echo "Extracting: $(basename "$source_zip")"

              if ! unzip -q "$source_zip" -d "$extract_dir"; then
                echo "Skipping invalid ZIP: $source_zip"
                continue
              fi

              while IFS= read -r -d '' settings; do
                candidate="$(dirname "$settings")"
                if is_android_project "$candidate"; then
                  PROJECT_DIR="$candidate"
                  break
                fi
              done < <(find "$extract_dir" -maxdepth 8 -type f \
                \( -name settings.gradle -o -name settings.gradle.kts \) -print0)

              [[ -n "$PROJECT_DIR" ]] && break
            done < <(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f \
              -iname '*.zip' -print0)
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo 'ERROR: No complete Android project found.' >&2
            echo 'Upload the complete Watch8 source ZIP.' >&2
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | head -60
            exit 1
          fi

          echo "Found Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          ls -la "$PROJECT_DIR"

      - name: Check preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          test -n "${ANDROID_HOME:-}"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Ensure Android 35 platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || \
                ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
          else
            echo "Android SDK 35 is ready"
          fi

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Wear OS APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p "$PROJECT_DIR" :app:assembleDebug
          test -f "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload Watch8 APK
        uses: actions/upload-artifact@v4
        with:
          name: Watch8-WorldClock-6Cities-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
